      const LucideIcon = ({ name, className = "w-4 h-4", strokeWidth = 1.8 }) => {
        const iconRef = useRef(null);
        useEffect(() => {
          if (iconRef.current && window.lucide) {
            iconRef.current.innerHTML = '';
            const el = document.createElement('i');
            el.setAttribute('data-lucide', name);
            if (className) el.setAttribute('class', className);
            el.setAttribute('stroke-width', strokeWidth);
            iconRef.current.appendChild(el);
            window.lucide.createIcons({ root: iconRef.current });
          }
        }, [name, className, strokeWidth]);
        return <span ref={iconRef} className="inline-flex items-center justify-center" />;
      };

      const formatINR = (amount) => {
        if (amount === undefined || amount === null) return '₹0';
        return '₹' + Number(amount).toLocaleString('en-IN');
      };

      const calculateNights = (start, end) => {
        if (!start || !end) return 3;
        const d1 = new Date(start);
        const d2 = new Date(end);
        const diffTime = d2.getTime() - d1.getTime();
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        return diffDays > 0 ? diffDays : 3;
      };

      const formatDateRange = (startStr, endStr) => {
        if (!startStr || !endStr) return '';
        const d1 = new Date(startStr);
        const d2 = new Date(endStr);
        const options = { month: 'short', day: 'numeric' };
        const yearOptions = { month: 'short', day: 'numeric', year: 'numeric' };
        if (isNaN(d1.getTime()) || isNaN(d2.getTime())) return '';
        if (d1.getFullYear() === d2.getFullYear()) {
          return `${d1.toLocaleDateString('en-IN', options)} – ${d2.toLocaleDateString('en-IN', yearOptions)}`;
        }
        return `${d1.toLocaleDateString('en-IN', yearOptions)} – ${d2.toLocaleDateString('en-IN', yearOptions)}`;
      };

      const getAdjustedPackage = (pkg, tripParams) => {
        if (!pkg) return null;
        if (!tripParams || !tripParams.startDate || !tripParams.endDate) return pkg;

        const nights = calculateNights(tripParams.startDate, tripParams.endDate);
        const baseNights = pkg.nights || 3;
        const ratio = nights / baseNights;
        const roomRatio = (tripParams.rooms || 1);

        const baseHotel = pkg.hotelCost || Math.round(pkg.baseCost * 0.48);
        const baseFood = pkg.foodCost || Math.round(pkg.baseCost * 0.15);
        const baseTransport = pkg.transportCost || Math.round(pkg.baseCost * 0.09);
        const baseFlight = pkg.flightCost || Math.round(pkg.baseCost * 0.28);

        const adjustedHotel = Math.round(baseHotel * ratio * roomRatio);
        const adjustedFood = Math.round(baseFood * ratio * ((tripParams.guests || 2) / 2));
        const adjustedTransport = Math.round(baseTransport * ratio);
        const flightCost = Math.round(baseFlight * ((tripParams.guests || 2) / 2));

        const adjustedBaseCost = flightCost + adjustedHotel + adjustedFood + adjustedTransport;

        return {
          ...pkg,
          nights: nights,
          baseCost: adjustedBaseCost,
          hotelCost: adjustedHotel,
          foodCost: adjustedFood,
          transportCost: adjustedTransport,
          flightCost: flightCost,
          startDate: tripParams.startDate,
          endDate: tripParams.endDate,
          dateRangeStr: formatDateRange(tripParams.startDate, tripParams.endDate)
        };
      };

        const [progress, setProgress] = useState(0);

        useEffect(() => {
          let frameId;
          let startTime = null;
          const duration = 1600;

          const easeInOutCubic = (t) => {
            return t < 0.5 
              ? 4 * t * t * t 
              : 1 - Math.pow(-2 * t + 2, 3) / 2;
          };

          const animateProgress = (timestamp) => {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const linearProgress = Math.min(elapsed / duration, 1);
            const easedProgress = easeInOutCubic(linearProgress) * 100;

            setProgress(easedProgress);

            if (linearProgress < 1) {
              frameId = requestAnimationFrame(animateProgress);
            } else {
              setTimeout(onFinish, 250);
            }
          };

          frameId = requestAnimationFrame(animateProgress);
          return () => { if (frameId) cancelAnimationFrame(frameId); };

            name: pkg.hotelName || `${city ? city.name : 'Luxury'} Boutique Hotel`,
            details: `${pkg.nights} Nights (${pkg.startDate || 'Start'} to ${pkg.endDate || 'End'}) · ${tripParams?.guests || 2} Guests · ${tripParams?.rooms || 1} Room(s) · Breakfast Included`,
            cost: hotelCost,
            provider: 'Hotel Direct / Official Partner',
            linkText: 'Reserve Room at Official Site',
            url: pkg.hotelLink || 'https://www.theimperialindia.com'
          },
          {
            id: 'food',
            category: 'Dining & Experiences',
            icon: Utensils,
            name: pkg.foodName || 'Curated Culinary & Heritage Pass',
            details: `${pkg.nights} Days of reserved tables & landmark entry vouchers`,
            cost: foodCost,
            provider: 'Verified Dining Sourcing',
            linkText: 'View Restaurant & Passes',
            url: pkg.foodLink || 'https://indianaccent.com'
          },
          {
            id: 'transport',
            category: 'Local Transport',
            icon: Car,
            name: pkg.transportName || 'Chauffeur Driven Transit',
            details: `Private airport transfers & chauffeur service for ${pkg.nights + 1} days`,
            cost: transportCost,
            provider: 'Local Chauffeur Sourcing',
            linkText: 'Pre-book Chauffeur Service',
            url: pkg.transportLink || 'https://www.uber.com'
          }
        ];

        return (
          <motion.div 
            initial={{ opacity: 0, y: 15 }}
            animate={{ opacity: 1, y: 0 }}
            exit={{ opacity: 0 }}
            transition={{ duration: 0.5, ease: EASING }}
            className="min-h-screen pt-32 pb-24 px-6 md:px-12 max-w-[1200px] mx-auto bg-[#FAF9F6]"
          >
            <div className="flex flex-col md:flex-row md:items-end justify-between pb-8 border-b border-black/10 mb-12">
              <div>
                <button 
                  onClick={onBackToPlan}
                  className="group inline-flex items-center space-x-2.5 px-4 py-2 mb-6 rounded-full bg-black/5 hover:bg-black text-black hover:text-white border border-black/10 transition-all duration-300 shadow-sm cursor-pointer"
                >
                  <ArrowLeft className="w-4 h-4 transition-transform group-hover:-translate-x-1" />
                  <span className="text-label text-xs tracking-widest font-sans font-medium">Back to Packages</span>
                </button>
                <span className="text-label text-xs text-gray-500 mb-2 block">DIRECT PROVIDER SOURCING</span>
                <h1 className="text-4xl md:text-6xl font-serif text-display">Payment & Booking Breakdown</h1>
              </div>
              <div className="mt-4 md:mt-0 flex items-center space-x-3 text-xs font-serif italic text-gray-500">
                <span>Live Sourcing Rates · {timeString || '12:00:00'}</span>
                <button 
                  onClick={handleRefresh}
                  className={`p-1.5 rounded-full hover:bg-black/5 transition-transform cursor-pointer ${isRefreshing ? 'animate-spin' : ''}`}
                  title="Refresh pricing data"
                >
                  <RefreshCw className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-12">
              <div className="lg:col-span-7 space-y-8">
                <div className="p-6 bg-white border border-gray-200">
                  <div className="flex justify-between items-start mb-4">
                    <div>
                      <span className="text-label text-[10px] text-gray-500 block">SELECTED ITINERARY</span>
                      <h3 className="text-2xl font-serif">{pkg.theme}</h3>
                    </div>
                    <span className="px-3 py-1 bg-black text-white text-xs font-serif rounded-full">
                      {pkg.nights} Nights
                    </span>
                  </div>
                  <p className="text-sm font-serif italic text-gray-600 mb-4">
                    {city ? city.name : 'Destination'} · {pkg.dateRangeStr || 'Selected Travel Dates'}
                  </p>
                  <div className="flex flex-wrap gap-4 text-xs font-serif text-gray-500 pt-4 border-t border-gray-100">
                    <span><strong>From:</strong> {tripParams?.origin || 'Bangalore'}</span>
                    <span><strong>Guests:</strong> {tripParams?.guests || 2}</span>
                    <span><strong>Rooms:</strong> {tripParams?.rooms || 1}</span>
                  </div>
                </div>

                <div className="space-y-6">
                  <h2 className="text-2xl font-serif">Verified Direct Sourcing Links</h2>
                  {sourcingItems.map((item) => {
                    const Icon = item.icon;
                    return (
                      <div key={item.id} className="p-6 bg-white border border-gray-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div className="space-y-1">
                          <div className="flex items-center space-x-2 text-xs text-gray-500">
                            <Icon className="w-4 h-4 text-black" strokeWidth={1.5} />
                            <span className="uppercase tracking-wider">{item.category}</span>
                            <span>·</span>
                            <span className="italic">{item.provider}</span>
                          </div>
                          <h4 className="text-lg font-serif font-medium text-black">{item.name}</h4>
                          <p className="text-xs text-gray-500">{item.details}</p>
                        </div>
                        <div className="flex sm:flex-col items-center sm:items-end justify-between gap-2 border-t sm:border-t-0 pt-3 sm:pt-0 border-gray-100">
                          <span className="text-lg font-serif tabular-nums font-semibold">{formatINR(item.cost)}</span>
                          <a 
                            href={item.url} 
                            target="_blank" 
                            rel="noopener noreferrer"
                            className="inline-flex items-center space-x-1.5 text-xs text-black underline underline-offset-4 hover:opacity-75 font-sans uppercase tracking-wider"
                          >
                            <span>{item.linkText}</span>
                            <ExternalLink className="w-3 h-3" />
                          </a>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="lg:col-span-5">
                <div className="bg-white border border-gray-200 p-8 sticky top-32">
                  <h2 className="text-2xl font-serif mb-6 pb-4 border-b border-black/10">Cost Summary</h2>

                  <div className="space-y-4 mb-8 font-serif text-sm">
                    <div className="flex justify-between items-center text-gray-600">
                      <span>Flights (Roundtrip)</span>
                      <span className="tabular-nums">{formatINR(flightCost)}</span>
                    </div>
                    <div className="flex justify-between items-center text-gray-600">
                      <span>Accommodation ({pkg.nights} Nights, {tripParams?.rooms || 1} Room{tripParams?.rooms > 1 ? 's' : ''})</span>
                      <span className="tabular-nums">{formatINR(hotelCost)}</span>
                    </div>
                    <div className="flex justify-between items-center text-gray-600">
                      <span>Dining & Experiences ({pkg.nights} Days)</span>
                      <span className="tabular-nums">{formatINR(foodCost)}</span>
                    </div>
                    <div className="flex justify-between items-center text-gray-600">
                      <span>Local Transit & Chauffeur</span>
                      <span className="tabular-nums">{formatINR(transportCost)}</span>
                    </div>

                    <div className="h-[1px] bg-gray-200 my-2" />

                    <div className="flex justify-between items-center text-gray-600">
                      <span className="flex items-center space-x-1">
                        <span>8% Contingency Reserve</span>
                        <span className="text-[10px] text-gray-400" title="Buffer for price fluctuations">(Buffer)</span>
                      </span>
                      <span className="tabular-nums text-gray-500">{formatINR(bufferCost)}</span>
                    </div>

                    <div className="h-[1px] bg-black my-4" />

                    <div className="flex justify-between items-baseline text-black pt-2">
                      <span className="text-lg font-serif">Total Estimated Cost</span>
                      <span className="text-3xl font-serif tabular-nums font-medium">{formatINR(totalAmount)}</span>
                    </div>
                    
                    {tripParams?.budget && (
                      <p className="text-xs text-right text-gray-500 italic mt-1">
                        Budget: {formatINR(tripParams.budget)} · {totalAmount <= tripParams.budget ? '✓ Within Allocated Budget' : 'Over budget by ' + formatINR(totalAmount - tripParams.budget)}
                      </p>
                    )}
                  </div>

                  <div className="p-4 border border-dashed border-gray-300 bg-white text-xs font-serif text-gray-600 space-y-2">
                    <div className="flex items-center space-x-2 text-black font-medium">
                      <Compass className="w-4 h-4" />
                      <span>Transparent Booking Guarantee</span>
                    </div>
                    <p>
                      Wayline does not add markup to flight or hotel prices. All sourcing links direct to partner booking engines.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </motion.div>
        );
      };

      function App() {
        const [isLoading, setIsLoading] = useState(true);
        const [appState, setAppState] = useState('landing');
        const [selectedCity, setSelectedCity] = useState(CITIES[0]);
        const [tripParams, setTripParams] = useState({ 
          origin: 'Bangalore', 
          startDate: new Date().toISOString().split('T')[0],
          endDate: new Date(Date.now() + 3 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
          dates: '3 Nights', 
          guests: 2, 
          rooms: 1,
          budget: 50000 
        });
        const [expandedPkg, setExpandedPkg] = useState(null);
        const [selectedPkgForBooking, setSelectedPkgForBooking] = useState(null);

        useEffect(() => {
          const rawPackages = MOCK_PACKAGES[selectedCity.id] || MOCK_PACKAGES.delhi;
          if (rawPackages && rawPackages[0]) {
            setSelectedPkgForBooking(getAdjustedPackage(rawPackages[0], tripParams));
          }
        }, [selectedCity, tripParams]);

        const handleCitySelect = (city) => {
          setSelectedCity(city);
          setAppState('details');
        };

        const handleDetailsComplete = (params) => {
          setTripParams(params);
          setAppState('packages');
        };

        const handleBookPackage = (pkg) => {
          setSelectedPkgForBooking(pkg);
          setExpandedPkg(null);
          setAppState('payment');
        };

        const triggerLogoReset = () => {
          setExpandedPkg(null);
          setAppState('landing');
          setIsLoading(true);
        };

        const handleSelectTab = (tabId) => {
          if (tabId === 'location') {
            triggerLogoReset();
          } else if (tabId === 'plan') {
            if (!tripParams) {
              setAppState('details');
            } else {
              setAppState('packages');
            }
          } else if (tabId === 'payment') {
            setAppState('payment');
          }
        };

        const currentPackages = (MOCK_PACKAGES[selectedCity.id] || MOCK_PACKAGES.delhi).map(pkg => 
          getAdjustedPackage(pkg, tripParams)
        );

        return (
          <div className="min-h-screen bg-[#FAF9F6] text-black font-serif relative selection:bg-black selection:text-white">
            <AnimatePresence mode="wait">
              {isLoading && (
                <LoadingScreen key="loader" onFinish={() => setIsLoading(false)} />
              )}
            </AnimatePresence>

            {!isLoading && (
              <>
                <TopBar activeTab={appState === 'landing' ? 'location' : appState === 'payment' ? 'payment' : 'plan'} onSelectTab={handleSelectTab} />

                <main>
                  {appState === 'landing' && (
                    <CityHero onSelectCity={handleCitySelect} />
                  )}

                  {appState === 'details' && (
                    <TripDetailsSheet 
                      city={selectedCity} 
                      onComplete={handleDetailsComplete}
                      onBack={() => setAppState('landing')}
                    />
                  )}

                  {appState === 'packages' && (
                    <div className="min-h-screen pt-32 pb-24 px-6 md:px-12 max-w-[1440px] mx-auto bg-[#FAF9F6]">
                      <div className="relative rounded-3xl overflow-hidden mb-14 border border-black/10 bg-white">
                        <img
                          src={(CITY_FOOD_BACKGROUNDS[selectedCity.id] || CITY_FOOD_BACKGROUNDS.delhi).image}
                          alt={selectedCity.name}
                          className="absolute inset-0 w-full h-full object-cover opacity-15"
                        />
                        <div className="absolute inset-0 bg-gradient-to-r from-[#FAF9F6] via-[#FAF9F6]/90 to-[#FAF9F6]/60" />

                        <div className="relative z-10 p-8 md:p-10 flex flex-col md:flex-row md:items-end justify-between">
                          <div>
                            <span className="text-label text-xs text-gray-500 mb-2 block">CURATED EXPERIENCES & GASTRONOMY</span>
                            <h1 className="text-5xl md:text-7xl font-serif text-display mb-3">{selectedCity.name}</h1>
                            <p className="text-xs md:text-sm font-serif italic text-gray-600 flex items-center space-x-2">
                              <Utensils className="w-3.5 h-3.5 text-black/70" />
                              <span>Featuring {(CITY_FOOD_BACKGROUNDS[selectedCity.id] || CITY_FOOD_BACKGROUNDS.delhi).dish}</span>
                            </p>
                          </div>
                          <div className="mt-6 md:mt-0 text-left md:text-right font-serif text-sm text-gray-600">
                            <p>From {tripParams.origin || 'Bangalore'} · {tripParams.guests} Guests · {tripParams.rooms} Room(s)</p>
                            <p className="italic">{tripParams.dates} ({tripParams.startDate} to {tripParams.endDate})</p>
                            <p className="font-semibold text-black mt-1">Target Budget: {formatINR(tripParams.budget)}</p>
                          </div>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        {currentPackages.map((pkg) => (
                          <PackageCard 
                            key={pkg.id} 
                            pkg={pkg} 
                            city={selectedCity}
                            budget={tripParams.budget}
                            onClick={() => setExpandedPkg(pkg)}
                          />
                        ))}
                      </div>

                      <AnimatePresence>
                        {expandedPkg && (
                          <ExpandedPackage 
                            pkg={expandedPkg} 
                            city={selectedCity} 
                            onClose={() => setExpandedPkg(null)}
                            onBook={handleBookPackage}
                          />
                        )}
                      </AnimatePresence>
                    </div>
                  )}

                  {appState === 'payment' && (
                    <PaymentView 
                      pkg={selectedPkgForBooking} 
                      city={selectedCity}
                      tripParams={tripParams}
                      onBackToPlan={() => setAppState('packages')}
                    />
                  )}
                </main>
              </>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
